<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Loan Engine Teardown</title>
  <meta name="description" content="Nine charts measuring the Smart Loan Eligibility dataset and codebase.">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    /* Document reset (the Artifact host normally supplies this) */
    :root {
      color-scheme: light;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    body { margin: 0; font: 14px system-ui, -apple-system, sans-serif; }
    img { max-width: 100%; }
    [hidden] { display: none !important; }
  </style>
  <style>
  /* Chart deck. One 1080px column, figures stacked, two per row on wide screens.
     Series pair validated for CVD in both themes. */
  :root {
    --bg:          #F3F6F4;
    --surface:     #FFFFFF;
    --surface-2:   #E8EDEA;
    --fg:          #111A17;
    --fg-dim:      #55655F;
    --fg-faint:    #7E8E89;
    --line:        #D2DAD7;
    --line-strong: #B4C0BC;
    --accent:      #0E6B52;
    --accent-soft: #D9EBE3;
    --dead:        #972C27;

    /* chart series - validated: CVD dE 19.0 protan, 25.8 normal, contrast >= 3:1 */
    --s-app:  #0A7DA8;
    --s-rej:  #C2691A;
    --s-neut: #8A9995;

    --font-display: "Bitter", Georgia, "Times New Roman", serif;
    --font-body:    "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono:    "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:          #0C1311;
      --surface:     #141E1B;
      --surface-2:   #1C2825;
      --fg:          #E5EDEA;
      --fg-dim:      #99AAA5;
      --fg-faint:    #6F817C;
      --line:        #293935;
      --line-strong: #3C4F4A;
      --accent:      #4FBF9A;
      --accent-soft: #11302A;
      --dead:        #E8847B;
      --s-app:  #2E92B8;
      --s-rej:  #C87C22;
      --s-neut: #6F817C;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:          #0C1311;
    --surface:     #141E1B;
    --surface-2:   #1C2825;
    --fg:          #E5EDEA;
    --fg-dim:      #99AAA5;
    --fg-faint:    #6F817C;
    --line:        #293935;
    --line-strong: #3C4F4A;
    --accent:      #4FBF9A;
    --accent-soft: #11302A;
    --dead:        #E8847B;
    --s-app:  #2E92B8;
    --s-rej:  #C87C22;
    --s-neut: #6F817C;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  header { border-bottom: 1px solid var(--line); background: var(--surface); }
  header .wrap { padding-block: 26px 22px; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--fg-dim);
    margin: 0 0 8px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(25px, 4.6vw, 36px);
    line-height: 1.08;
    letter-spacing: -0.016em;
    margin: 0;
  }
  .counts {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    margin: 20px 0 0;
    border-radius: 3px;
    overflow: hidden;
  }
  .count { background: var(--surface); padding: 13px 15px; min-width: 0; }
  .count dt {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg-dim);
    margin: 0 0 5px;
  }
  .count dd {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 26px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .count dd .of { font-size: 13px; font-weight: 500; color: var(--fg-dim); }
  .count.flag dd { color: var(--dead); }

  main { padding-block: 20px 44px; display: flex; flex-direction: column; gap: 16px; }
  .duo { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }

  figure {
    margin: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    min-width: 0;
  }
  figcaption { padding: 15px 18px 0; }
  .fig-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -0.008em;
    margin: 0 0 3px;
    text-wrap: balance;
  }
  .fig-scale {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--fg-faint);
    margin: 0;
  }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; padding: 11px 18px 0; }
  .lg { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--fg-dim); }
  .lg .sw { width: 11px; height: 11px; border-radius: 2px; flex: none; }
  .lg .dash { width: 14px; height: 0; border-top: 2px dashed var(--dead); flex: none; }
  .fig-body { padding: 8px 18px 18px; overflow-x: auto; }
  svg { display: block; min-width: 520px; width: 100%; height: auto; }
  .grid { stroke: var(--line); stroke-width: 1; }
  .ax { fill: var(--fg-faint); font-family: var(--font-mono); font-size: 10px; }
  .axis-title { fill: var(--fg-dim); font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.06em; }
  .barval { fill: var(--fg); font-family: var(--font-mono); font-size: 11px; font-weight: 700; }
  .b.app { fill: var(--s-app); }
  .b.rej { fill: var(--s-rej); }
  .gate { stroke: var(--dead); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .gate-lbl { fill: var(--dead); font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; }
  .ln { fill: none; stroke-width: 2; }
  .ln.train { stroke: var(--s-rej); }
  .ln.val { stroke: var(--s-app); stroke-dasharray: 5 4; }
  .dot { fill: var(--s-app); stroke: var(--surface); stroke-width: 1.5; }

  /* CSS bar charts */
  .bars { display: flex; flex-direction: column; gap: 3px; padding: 6px 18px 8px; }
  .row { display: grid; grid-template-columns: minmax(92px, 158px) minmax(0, 1fr); gap: 12px; align-items: center; }
  .row-lbl { font-size: 13px; color: var(--fg-dim); text-align: right; min-width: 0; overflow-wrap: anywhere; }
  .row-lbl b { color: var(--fg); font-weight: 600; }
  .row-lbl .mono { font-family: var(--font-mono); font-size: 12px; }
  .track { position: relative; height: 21px; display: flex; align-items: center; }
  .fill { height: 14px; border-radius: 2px; min-width: 2px; }
  .fill.app { background: var(--s-app); }
  .fill.rej { background: var(--s-rej); }
  .fill.neut { background: var(--s-neut); }
  .fill.hi { background: var(--dead); }
  .val {
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    color: var(--fg-dim);
    padding-left: 8px;
    white-space: nowrap;
  }
  .val b { color: var(--fg); font-weight: 700; }
  .grp {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--fg);
    grid-column: 2;
    margin: 7px 0 1px;
  }
  .refline { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--line-strong); }
  .refcap { padding: 2px 18px 15px; font-size: 11px; color: var(--fg-faint); font-family: var(--font-mono); }

  footer { border-top: 1px solid var(--line); }
  footer .wrap { padding-block: 16px 26px; }
  footer p { margin: 0; font-size: 12px; color: var(--fg-faint); font-family: var(--font-mono); }

  @media (max-width: 780px) {
    .counts { grid-template-columns: repeat(2, 1fr); }
    .duo { grid-template-columns: minmax(0, 1fr); }
    .row { grid-template-columns: minmax(0, 1fr); gap: 2px; }
    .row-lbl { text-align: left; }
    .grp { grid-column: 1; }
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <p class="eyebrow">Smart Loan Eligibility &middot; dataset.csv &middot; commit 9f02060</p>
    <h1>Loan Engine Teardown</h1>
    <dl class="counts">
      <div class="count"><dt>Rows</dt><dd>50,000</dd></div>
      <div class="count"><dt>Class split</dt><dd>25k<span class="of"> / 25k</span></dd></div>
      <div class="count flag"><dt>Reported accuracy</dt><dd>99.96<span class="of">%</span></dd></div>
      <div class="count flag"><dt>One boolean scores</dt><dd>88.62<span class="of">%</span></dd></div>
    </dl>
  </div>
</header>

<main class="wrap">

  <figure>
    <figcaption>
      <p class="fig-title">Training vs validation loss</p>
      <p class="fig-scale">150 boosting rounds &middot; log loss &middot; maximum gap between the two curves: 0.0003</p>
    </figcaption>
    <div class="legend">
      <span class="lg"><span class="sw" style="background:var(--s-rej)"></span>Train loss</span>
      <span class="lg"><span class="sw" style="background:var(--s-app)"></span>Validation loss</span>
    </div>
    <div class="fig-body">

        <line class="grid" x1="56.0" y1="48.6" x2="700.0" y2="48.6"/><text class="ax" x="48.0" y="52.1" text-anchor="end">0.6</text>

  <figure>
    <figcaption>
      <p class="fig-title">Accuracy by approach</p>
      <p class="fig-scale">scale 0&ndash;100% &middot; dashed line = 50% coin flip on balanced classes</p>
    </figcaption>
    <div class="bars">
      <div class="row">
        <span class="row-lbl"><b>Gradient boosting</b>, 14 features</span>
        <div class="track"><span class="refline" style="left:50%"></span><span class="fill neut" style="width:100%"></span><span class="val"><b>100.00%</b></span></div>
      </div>
      <div class="row">
        <span class="row-lbl"><b>XGBoost as shipped</b></span>
        <div class="track"><span class="refline" style="left:50%"></span><span class="fill neut" style="width:99.96%"></span><span class="val"><b>99.96%</b></span></div>
      </div>
      <div class="row">
        <span class="row-lbl">FICO rounded, FICO + rate dropped</span>
        <div class="track"><span class="refline" style="left:50%"></span><span class="fill neut" style="width:97.98%"></span><span class="val">97.98%</span></div>
      </div>
